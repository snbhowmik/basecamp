_format_version: "2.1"
_transform: true

# Basecamp v1.0.0 — Kong declarative gateway config
# Routes the public-facing paths PostgREST/GoTrue/Storage/Realtime clients
# expect (matching @supabase/supabase-js's default URL shape) to the internal
# services. This is the only container with a published port — see
# docker-compose.yml.

# Without this, the browser blocks every cross-origin request the frontend
# makes to Kong (curl/server-to-server calls don't enforce CORS, so this is
# easy to miss testing with curl alone — it only bites in an actual browser).
# origins: "*" for now since the frontend's real origin isn't fixed yet
# (local dev port, eventual production domain) — tighten to the real
# deployed origin once that's fixed, per SECURITY.md.
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        [
          Authorization,
          apikey,
          Content-Type,
          X-Client-Info,
          Prefer,
          X-Supabase-Api-Version,
          Range,
          Accept-Profile,
          Content-Profile,
        ]
      credentials: true

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1

  - name: realtime-v1
    url: http://realtime:4000/socket
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1

  - name: storage-v1
    url: http://storage:5000
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1
