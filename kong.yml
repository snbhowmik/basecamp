_format_version: "2.1"
_transform: true

# Basecamp v1.0.0 — Kong declarative gateway config
# Routes the public-facing paths PostgREST/GoTrue/Storage/Realtime clients
# expect (matching @supabase/supabase-js's default URL shape) to the internal
# services. This is the only container with a published port — see
# docker-compose.yml.

# Without this, the browser blocks every cross-origin request the frontend
# makes to Kong (curl/server-to-server calls don't enforce CORS, so this is
# easy to miss testing with curl alone — it only bites in an actual browser).
# Locked to the real production origin — was "*" during local dev/testing,
# tightened once the deployed domain was fixed, per SECURITY.md.
plugins:
  - name: cors
    config:
      origins:
        - "https://basecamp.hackerxploit.org"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        [
          Authorization,
          apikey,
          Content-Type,
          X-Client-Info,
          Prefer,
          X-Supabase-Api-Version,
          Range,
          Accept-Profile,
          Content-Profile,
        ]
      credentials: true

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1

  - name: realtime-v1
    url: http://realtime:4000/socket
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1

  - name: storage-v1
    url: http://storage:5000
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1

  # Catch-all — the built SPA. Kong's router matches the more specific
  # /auth/v1, /rest/v1, /realtime/v1, /storage/v1 prefixes above first
  # regardless of declaration order, so this only catches everything else.
  - name: frontend
    url: http://frontend:80
    routes:
      - name: frontend-route
        paths:
          - /
