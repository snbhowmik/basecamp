# Basecamp — SPA fallback for the frontend static server.
#
# Without this, the stock nginx:alpine default config serves files
# literally: a direct visit to /register or /invite/<token> (exactly how a
# staff member arrives — clicking a link in a fresh email, not navigating
# client-side from an already-loaded tab) 404s, because those paths aren't
# real files on disk. Same class of bug as GoTrue's /verify link needing
# the /auth/v1 prefix in kong.yml — anything that can be hit as a direct
# URL, not just via client-side routing, needs the server to know about it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
