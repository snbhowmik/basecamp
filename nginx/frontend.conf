# Basecamp — SPA fallback for the frontend static server.
#
# Without this, the stock nginx:alpine default config serves files
# literally: a direct visit to /register or /invite/<token> (exactly how a
# staff member arrives — clicking a link in a fresh email, not navigating
# client-side from an already-loaded tab) 404s, because those paths aren't
# real files on disk. Same class of bug as GoTrue's /verify link needing
# the /auth/v1 prefix in kong.yml — anything that can be hit as a direct
# URL, not just via client-side routing, needs the server to know about it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects stay relative. Kong forwards this request with Host "frontend",
    # so an absolute Location would send the browser to a host it cannot reach.
    absolute_redirect off;

    # The Vue/frappe-ui app is the default at the site root. It used to live at
    # /next/, and links from before the move (emails, bookmarks) still use that
    # prefix, so send them to the same path without it.
    location = /next {
        return 301 /;
    }
    location /next/ {
        rewrite ^/next/(.*)$ /$1 permanent;
    }

    # The previous React app, same origin so the Supabase session in
    # localStorage is shared. Its own SPA fallback, rooted at /rfold/.
    location /rfold/ {
        alias /usr/share/nginx/rfold/;
        try_files $uri $uri/ /rfold/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
